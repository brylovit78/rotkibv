name: rotkibv
services:
  rotki:
    image: ${ROTKIBV_IMAGE:?Set ROTKIBV_IMAGE to a release tag or digest}
    restart: unless-stopped
    ports:
      - "${ROTKIBV_BIND:-127.0.0.1}:${ROTKIBV_PORT:-8080}:80"
    volumes:
      - rotki-data:/data
      - rotki-logs:/logs
      - rotki-config:/config
    stop_grace_period: 60s
volumes:
  rotki-data:
  rotki-logs:
  rotki-config:
