name: Fork image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build metadata
        id: meta
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          source .github/fork.env
          version="${UPSTREAM_TAG#v}"
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-bv\.([1-9][0-9]*)$ ]]
            [[ "${BASH_REMATCH[1]}" == "$version" ]]
            version="$version+rotkibv.${BASH_REMATCH[2]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build from this checkout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rotkibv:check
          build-args: |
            ROTKI_VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/brylovit78/rotkibv
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=rotkibv-amd64
          cache-to: type=gha,mode=max,scope=rotkibv-amd64
      - name: Smoke test the built image
        run: python3 tools/fork/smoke.py rotkibv:check
      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: inputs.publish
        env:
          IMAGE: ghcr.io/brylovit78/rotkibv
        run: |
          docker tag rotkibv:check "$IMAGE:$GITHUB_REF_NAME"
          docker tag rotkibv:check "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
